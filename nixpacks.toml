# Nixpacks configuration for Railway deployment
# Ensures FFmpeg, Fontconfig, and Liberation fonts are properly installed and linked

[phases.setup]
nixPkgs = ["nodejs-20_x", "ffmpeg", "fontconfig", "liberation_ttf", "dejavu_fonts"]
aptPkgs = ["...", "fontconfig", "fonts-liberation", "fonts-dejavu-core", "libfontconfig1"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm run start"

